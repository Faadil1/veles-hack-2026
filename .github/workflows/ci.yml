name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  real-ide:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -r requirements-dev.txt
      - name: Start the official IDE backend
        run: |
          docker run -d --rm -p 3001:3001 -e AUTH_ENABLED=false --name ide-backend donmichael/ide-backend:latest
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:3001/api/files && break; sleep 1; done
          docker image inspect donmichael/ide-backend:latest --format '{{.Id}}' > /tmp/backend-digest.txt
      - name: Validator parity (backend's own validation code vs Steward's port)
        run: |
          mkdir -p /tmp/val && docker cp ide-backend:/app/src/validation /tmp/val/validation
          docker cp ide-backend:/app/node_modules /tmp/val/node_modules
          echo '{"type":"module","private":true}' > /tmp/val/package.json
          mkdir -p /tmp/out && python -m evaluation.validator_parity --validator-dir /tmp/val --out /tmp/out/validator-parity.json
          echo "::notice title=validator-parity::$(python3 -c 'import json;d=json.load(open("/tmp/out/validator-parity.json"));print(d["documents"],"docs",d["disagreements"],"disagreements")')"
      - name: Live vertical slice (Steward + real backend + GUI action replica)
        run: |
          python -m evaluation.live_slice --backend http://localhost:3001/api --out /tmp/out/live-slice.json
          echo "::notice title=live-slice::$(python3 -c 'import json;d=json.load(open("/tmp/out/live-slice.json"));print(d["passed"],"/",d["total"],"effects",d["effects"],"undo identical",d["undo_restored_identical_bytes"])')"
      - name: Publish evidence
        if: always() && github.event_name != 'pull_request'
        run: |
          cp /tmp/backend-digest.txt /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/commit.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-evidence && git checkout -B ci-evidence origin/ci-evidence
          rm -rf real-ide && mkdir -p real-ide && cp -r /tmp/out/* real-ide/ && git add real-ide && git commit -m "real-ide ${GITHUB_SHA::7}" || true
          for i in 1 2 3 4; do git push origin ci-evidence && break; sleep $((i*5)); git fetch origin ci-evidence && git rebase origin/ci-evidence; done
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/faadil1/hyperion-steward:${{ github.sha }}
            ghcr.io/faadil1/hyperion-steward:latest
          labels: org.opencontainers.image.source=https://github.com/Faadil1/veles-hack-2026
      - name: Container smoke test (degraded mode, no secrets)
        run: |
          docker run -d --name steward-smoke -p 8000:8000 -e STEWARD_DISABLE_LLM=1 ghcr.io/faadil1/hyperion-steward:${{ github.sha }} 2>/tmp/run.err \
            || { echo "::error title=docker-run::$(tr '\n' ' ' </tmp/run.err) | images: $(docker images --format '{{.Repository}}:{{.Tag}}' | tr '\n' ' ')"; exit 1; }
          ok=0; for i in $(seq 1 30); do if curl -fs localhost:8000/health; then ok=1; break; fi; sleep 1; done
          if [ $ok -ne 1 ]; then echo "::error title=container-smoke::health never came up: $(docker logs steward-smoke 2>&1 | tail -20 | tr '\n' ' ')"; exit 1; fi
          curl -fsN -X POST localhost:8000/chat -H 'content-type: application/json' \
            -d '{"user_id":"ci","text":"how do I deploy a workflow?"}' > /tmp/sse.txt
          grep -q '^data: {"response"' /tmp/sse.txt || { echo "::error title=container-smoke::$(head -c 400 /tmp/sse.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice title=container-smoke::$(head -c 300 /tmp/sse.txt | tr '\n' ' ')"
      - name: Container against the real IDE backend (evaluation wiring, deterministic check command)
        run: |
          docker run -d --rm -p 3001:3001 -e AUTH_ENABLED=false --name ide-backend donmichael/ide-backend:latest
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:3001/api/files && break; sleep 1; done
          curl -fs -X POST localhost:3001/api/file -H 'content-type: application/json' \
            --data "$(python3 -c 'import json;print(json.dumps({"path":"ci/hello.yaml","content":open("tests/fixtures/cookbook/device-hello-world-docker.yaml").read()}))')"
          docker run -d --name steward-wired -p 8001:8000 --add-host host.docker.internal:host-gateway \
            -e STEWARD_DISABLE_LLM=1 ghcr.io/faadil1/hyperion-steward:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8001/health >/dev/null && break; sleep 1; done
          curl -fsN -X POST localhost:8001/chat -H 'content-type: application/json' \
            -d '{"user_id":"ci","text":"check ci/hello.yaml"}' > /tmp/wired.txt
          grep -q 'IDE validator: \*\*valid' /tmp/wired.txt || { echo "::error title=wired::$(head -c 600 /tmp/wired.txt | tr '\n' ' ') $(docker logs steward-wired 2>&1 | tail -10 | tr '\n' ' ')"; exit 1; }
          echo "::notice title=wired::$(head -c 300 /tmp/wired.txt | tr '\n' ' ')"
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/faadil1/hyperion-steward:${{ github.sha }}
          docker push ghcr.io/faadil1/hyperion-steward:latest
          echo "::notice title=image::ghcr.io/faadil1/hyperion-steward:${{ github.sha }}"
      - name: Push evaluation image to Docker Hub (<user>/hyperion:latest), when the team account is configured
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning title=dockerhub::HUMAN_REQUIRED: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets not set; evaluation image not pushed"; exit 0; fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag ghcr.io/faadil1/hyperion-steward:${{ github.sha }} "$DOCKERHUB_USERNAME/hyperion:latest"
          docker tag ghcr.io/faadil1/hyperion-steward:${{ github.sha }} "$DOCKERHUB_USERNAME/hyperion:${GITHUB_SHA::7}"
          docker push "$DOCKERHUB_USERNAME/hyperion:latest"; docker push "$DOCKERHUB_USERNAME/hyperion:${GITHUB_SHA::7}"
          digest=$(docker image inspect "$DOCKERHUB_USERNAME/hyperion:latest" --format '{{index .RepoDigests 0}}')
          echo "::notice title=dockerhub::$DOCKERHUB_USERNAME/hyperion:latest = ${GITHUB_SHA::7} ($digest)"
