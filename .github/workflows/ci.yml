name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/faadil1/hyperion-steward:${{ github.sha }}
            ghcr.io/faadil1/hyperion-steward:latest
          labels: org.opencontainers.image.source=https://github.com/Faadil1/veles-hack-2026
      - name: Container smoke test (degraded mode, no secrets)
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name s -p 8000:8000 -e STEWARD_DISABLE_LLM=1 ghcr.io/faadil1/hyperion-steward:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fsN -X POST localhost:8000/chat -H 'content-type: application/json' \
            -d '{"user_id":"ci","text":"how do I deploy a workflow?"}' | tee /tmp/sse.txt
          grep -q '^data: {"response"' /tmp/sse.txt
          echo "::notice title=container-smoke::$(head -c 300 /tmp/sse.txt | tr '\n' ' ')"
