name: runner-probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability of sponsor hosts from CI
        run: |
          for u in https://gitlab.eclipse.org https://ide.hyperai.di.uoa.gr https://ide-tutorial.hyperai.di.uoa.gr https://hub.docker.com; do
            printf "%s " "$u"; curl -s -o /dev/null -m 15 -w "%{http_code}\n" "$u" || echo fail; done
