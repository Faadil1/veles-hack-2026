applicationProfile:

  metadata:
    type: native
    schemaVersion: 1.0.0
    name: "sabo-server"
    uid: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
    version: "1.0.0"
    description: "Django backend server for the Sabo application."
    owner: "Michael Loukeris (UoA)"
    lifecyclePhase: "production"
    createdAt: "2026-02-12T10:00:00Z"
    
    annotations:
      intent: "web-backend"
      domain: "sabo-app"
      language: "Python 3.10"
      dependencies: ["Django", "Gunicorn"]
      framework: "Django"
      parentApp:
        name: ""
        uid: ""

  specs:
    runtime:
      executionType: "container"
      entryPoint: "gunicorn config.wsgi:application"
      args: ["--bind", "0.0.0.0:8000"]
      
      baseOS:
        name: "debian"
        version: "11"
      
      acceleratorRuntime: []
      
      containerImage:
        uri: "docker.io/donmichael/server-sabo"
        tag: "latest"

    resources:
      cpu: "1000m"
      memory: "2Gi"
      storage: "10Gi"
      gpu: 0
      tpu: 0
      accelerators: []

    network:
      ports:
        - port: 8000
          protocol: "TCP"
      networkBandwidthMin: "10Mbps"
      protocols: ["HTTP"]

    constraints:
      supportedArchitectures: ["x86_64", "arm64"]
      faultTolerance: "restart-on-failure"
      securityLevel: "medium"
      dataClassification: "public"
      trustScore: ">=3.0"
      geoLocationRequirement: "any"
      isHighlyAvailable: true

    qos:
      latencyToleranceMax: "150ms"
      energyCost: "2W avg"
      monetaryCost: "$0.05/hour"
      resilience: "auto-restart"
      availability: "99.5%"
      startupTime: "5s"