metadata:
  type: native # e.g. "integration", "device", "native"
  schemaVersion: 1.0.0
  name: "keycloak-auth"
  uid: "9e7a2f3b-6c44-4e8d-b3f2-8e0c4f6c1a22"
  version: "22.0.1"
  description: "Identity and access management service providing authentication and authorization."
  owner: "X Corp"
  lifecyclePhase: "production"
  createdAt: "2025-06-01T09:00:00Z"
  updatedAt: "2025-09-07T15:10:21.112345+00:00"
  annotations:
    intent: "identity-access-management"
    domain: "security"
    language: "Java (Quarkus)"
    dependencies: "Keycloak 22.x, PostgreSQL 14"

specs:
  runtime:
    acceleratorRuntime: [] # No hardware accelerators required
  image:
    uri: "quay.io/keycloak/keycloak"
    tag: "22.0.1"
    entryPoint: "/opt/keycloak/bin/kc.sh"
    args:
      - "start"
      - "--optimized"
    baseOS: "ubi8"
  executionType: "pod"

resources:
  cpu: "2000m"
  memory: "4Gi"
  storage: "20Gi"
  gpu: 0
  tpu: 0
  accelerators: []

network:
  ports:
    - port: 8080
      protocol: "HTTP"
    - port: 8443
      protocol: "HTTPS"
  networkBandwidthMin: "50Mbps"
  protocols: ["HTTP", "HTTPS"]

constraints:
  supportedArchitectures: ["x86_64", "arm64"]
  securityLevel: "5"
  dataClassification: "confidential"
  trustScore: "4.8"
  geoLocationRequirement: "Europe"
  isHighlyAvailable: true
  faultTolerance: "active-active"

qos:
  latencyToleranceMax: "200ms"
  energyCost: "0.2"
  monetaryCost: "0.05"
  resilience: "auto-restart"
  availability: "99.9%"
  startupTime: "30s"

status:
  isStateless: false
  isOnline: true
  lastHeartBeat: "2025-06-02T10:20:00Z"
  runtimeState: "running"
  resourceUsage:
    cpu: "1200m"
    memory: "2.8Gi"
    storage: "12Gi"
    gpu: 0
    tpu: 0
    accelerators: 0

