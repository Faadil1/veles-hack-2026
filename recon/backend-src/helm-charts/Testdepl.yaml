metadata:
  type: native # e.g. "integration", "device", "native"
  schemaVersion: 1.0.0
  name: "mqtt-broker"
  uid: "7d2a4c91-3b8e-4f73-9c6d-2f8a1b5e44aa"
  version: "5.3.0"
  description: "Lightweight publish/subscribe messaging broker for IoT and edge devices using MQTT."
  owner: "X Corp"
  lifecyclePhase: "production"
  createdAt: "2025-06-01T10:00:00Z"
  updatedAt: "2025-09-07T15:35:12.331904+00:00"
  annotations:
    intent: "iot-messaging"
    domain: "iot-platform"
    language: "Erlang / C"
    dependencies: "EMQX 5.x, TLS, Redis (optional for clustering)"

specs:
  runtime:
    acceleratorRuntime: [] # Network and memory bound, no accelerators
  image:
    uri: "docker.io/emqx/emqx"
    tag: "5.3.0"
    entryPoint: "/opt/emqx/bin/emqx"
    args:
      - "start"
    baseOS: "alpine-3.18"
  executionType: "pod"

resources:
  cpu: "2000m"
  memory: "4Gi"
  storage: "20Gi"
  gpu: 0
  tpu: 0
  accelerators: []

network:
  ports:
    - port: 1883
      protocol: "TCP"     # MQTT
    - port: 8883
      protocol: "TLS"     # MQTT over TLS
    - port: 8083
      protocol: "WS"      # MQTT over WebSocket
    - port: 8084
      protocol: "WSS"     # MQTT over Secure WebSocket
  networkBandwidthMin: "100Mbps"
  protocols: ["TCP", "TLS", "WS", "WSS"]

constraints:
  supportedArchitectures: ["x86_64", "arm64"]
  securityLevel: "4"
  dataClassification: "confidential"
  trustScore: "4.4"
  geoLocationRequirement: "Europe"
  isHighlyAvailable: true
  faultTolerance: "session-replication"

qos:
  latencyToleranceMax: "20ms"
  energyCost: "0.3"
  monetaryCost: "0.08"
  resilience: "auto-restart"
  availability: "99.9%"
  startupTime: "10s"

status:
  isStateless: false
  isOnline: true
  lastHeartBeat: "2025-06-02T10:30:00Z"
  runtimeState: "running"
  resourceUsage:
    cpu: "1100m"
    memory: "2.3Gi"
    storage: "8Gi"
    gpu: 0
    tpu: 0
    accelerators: 0

