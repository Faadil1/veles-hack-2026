metadata:
  type: native # e.g. "integration", "device", "native"
  schemaVersion: 1.0.0
  name: "kafka-broker"
  uid: "3b6f9d27-91c5-4d6a-9c1e-8b9a6f2a77d4"
  version: "3.6.1"
  description: "Distributed event streaming platform for high-throughput, fault-tolerant messaging."
  owner: "X Corp"
  lifecyclePhase: "production"
  createdAt: "2025-06-01T09:30:00Z"
  updatedAt: "2025-09-07T15:22:48.774321+00:00"
  annotations:
    intent: "event-streaming"
    domain: "data-platform"
    language: "Scala / Java"
    dependencies: "Apache Kafka 3.6.x, KRaft (no ZooKeeper)"

specs:
  runtime:
    acceleratorRuntime: [] # Kafka is CPU / IO bound
  image:
    uri: "docker.io/bitnami/kafka"
    tag: "3.6.1"
    entryPoint: "/opt/bitnami/scripts/kafka/run.sh"
    args: []
    baseOS: "debian-11"
  executionType: "pod"

resources:
  cpu: "4000m"
  memory: "8Gi"
  storage: "200Gi"
  gpu: 0
  tpu: 0
  accelerators: []

network:
  ports:
    - port: 9092
      protocol: "TCP"
    - port: 9093
      protocol: "TCP" # inter-broker / controller (KRaft)
  networkBandwidthMin: "1Gbps"
  protocols: ["TCP"]

constraints:
  supportedArchitectures: ["x86_64", "arm64"]
  securityLevel: "4"
  dataClassification: "confidential"
  trustScore: "4.6"
  geoLocationRequirement: "Europe"
  isHighlyAvailable: true
  faultTolerance: "replicated-partitions"

qos:
  latencyToleranceMax: "10ms"
  energyCost: "0.7"
  monetaryCost: "0.25"
  resilience: "auto-restart"
  availability: "99.95%"
  startupTime: "60s"

status:
  isStateless: false
  isOnline: true
  lastHeartBeat: "2025-06-02T10:25:00Z"
  runtimeState: "running"
  resourceUsage:
    cpu: "3100m"
    memory: "6.9Gi"
    storage: "128Gi"
    gpu: 0
    tpu: 0
    accelerators: 0

