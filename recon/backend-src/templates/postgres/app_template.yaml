metadata:
  type: native # e.g. "integration", "device", "native"
  schemaVersion: 1.0.0
  name: "postgres-db"
  uid: "5a8c2e91-4f2b-4c1d-9a6e-3d7f0b8e11cc"
  version: "15.5"
  description: "Relational database service for transactional and analytical workloads."
  owner: "X Corp"
  lifecyclePhase: "production"
  createdAt: "2025-05-30T08:45:00Z"
  updatedAt: "2025-09-07T15:48:03.998211+00:00"
  annotations:
    intent: "transactional-database"
    domain: "data-platform"
    language: "C"
    dependencies: "PostgreSQL 15.x, Patroni, pgBackRest"

specs:
  runtime:
    acceleratorRuntime: [] # Disk and memory bound
  image:
    uri: "docker.io/bitnami/postgresql"
    tag: "15.5.0"
    entryPoint: "/opt/bitnami/scripts/postgresql/run.sh"
    args: []
    baseOS: "debian-11"
  executionType: "pod"

resources:
  cpu: "4000m"
  memory: "16Gi"
  storage: "500Gi"
  gpu: 0
  tpu: 0
  accelerators: []

network:
  ports:
    - port: 5432
      protocol: "TCP"
  networkBandwidthMin: "200Mbps"
  protocols: ["TCP"]

constraints:
  supportedArchitectures: ["x86_64", "arm64"]
  securityLevel: "5"
  dataClassification: "confidential"
  trustScore: "4.9"
  geoLocationRequirement: "Europe"
  isHighlyAvailable: true
  faultTolerance: "synchronous-replication"

qos:
  latencyToleranceMax: "15ms"
  energyCost: "0.6"
  monetaryCost: "0.30"
  resilience: "auto-failover"
  availability: "99.95%"
  startupTime: "45s"

status:
  isStateless: false
  isOnline: true
  lastHeartBeat: "2025-06-02T10:35:00Z"
  runtimeState: "running"
  resourceUsage:
    cpu: "2800m"
    memory: "12.4Gi"
    s

